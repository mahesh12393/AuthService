spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:authservice}?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true

spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=root
#spring.datasource.password=password
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.main.allow-circular-references=true
#spring.jpa.properties.hibernate.hbm2ddl.auto=update
#try to automatically adjust the schema to match my entity classes, but do not drop data.
server.port=9878

logging.level.org.springframework.security=DEBUG
logging.level.your.package.name=DEBUG


spring.kafka.producer.bootstrap-servers=127.0.0.1:9092
spring.kafka.topic.name=test
spring.kafka.producer.value.serializer="org.example.serializer.UserInfoSerializer"
